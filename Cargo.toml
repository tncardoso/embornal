[package]
name = "embornal"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
casbin = { version = "2.20.0", default-features = false, features = ["runtime-tokio", "incremental", "cached"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
sqlite-vec = "0.1.9"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ulid = "3.0.0"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
