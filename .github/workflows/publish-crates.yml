name: Publish to crates.io

# The release workflow of dist makes the GitHub release. This one runs after
# it, so a failure here leaves the binaries where they are.
on:
  release:
    types: [published]
  # A release that reached GitHub but not crates.io runs again from here.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      # cargo publish builds the crate to verify it, and that build is the
      # whole of llama.cpp.
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake clang libclang-dev

      # A tag that says one version and a manifest that says another would
      # put the wrong number on crates.io.
      - name: Check that the tag matches the version
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "v$version" ]; then
            echo "the tag is $tag and Cargo.toml says $version" >&2
            exit 1
          fi

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
